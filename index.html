<title>SABORA · Menú</title>

<link rel="apple-touch-icon" href="icon-180.png">

<script>window.__menu=fetch("menu.json",{cache:"no-cache"}).then(function(r){if(!r.ok)throw r.status;return r.json()});</script>
<style>
:root{
  --paper:#ebe7e1;--card:#f6f3ef;--ink:#1e1e1b;--muted:#5f5b55;--green:#2f5f35;--line:#cdc6bb;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua","Noto Serif",Georgia,serif;
  --display:Didot,"Bodoni 72","Bodoni MT","Noto Serif Display",var(--serif);
  --script:"Snell Roundhand","Apple Chancery","Segoe Script","Brush Script MT",cursive;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth;background:var(--paper)}
html:has(dialog[open]){overflow:hidden}
body{margin:0;min-height:100dvh;font-family:var(--serif);color:var(--ink);-webkit-tap-highlight-color:transparent;
  background:var(--paper) radial-gradient(120% 60% at 15% 0%,rgba(255,255,255,.55),transparent 60%)}

.top{position:relative;max-width:680px;margin:0 auto;padding:calc(30px + env(safe-area-inset-top)) 24px 20px;overflow:hidden}
.sprig{position:absolute;top:calc(env(safe-area-inset-top) - 10px);right:-26px;width:min(46vw,210px);height:auto;color:var(--green);pointer-events:none}
.logo{margin:0;font-family:var(--script);color:var(--green);font-size:32px;letter-spacing:.08em}
h1{margin:2px 0 6px;font-family:var(--display);font-weight:400;font-size:clamp(68px,23vw,112px);line-height:.92;letter-spacing:-.01em}
.sub{margin:0 0 0 .2em;font-size:19px}
.rule{max-width:640px;height:6px;margin:0 auto;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);opacity:.55}

.tabs{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none;
  background:rgba(235,231,225,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;padding:9px 15px;border:1px solid var(--line);border-radius:999px;background:var(--card);
  color:var(--green);font-size:12.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;text-decoration:none}
.tabs a.on{background:var(--green);border-color:var(--green);color:#fff}

main{max-width:680px;margin:0 auto;padding:0 16px 24px}
section{scroll-margin-top:62px;padding-top:22px}
.cat{margin:0 4px 2px;padding-bottom:8px;border-bottom:1px solid var(--ink);color:var(--green);
  font-size:22px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.item{display:flex;align-items:center;gap:14px;width:100%;padding:16px 4px;border:0;border-bottom:1px solid var(--line);
  background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;touch-action:manipulation}
.item:active{background:rgba(47,95,53,.07)}
.tx{flex:1;min-width:0}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.item h3{margin:0;font-size:17.5px;font-weight:700}
.pr{flex:none;font-size:16px;font-weight:700;white-space:nowrap}
.item p{margin:5px 0 0;color:var(--muted);font-size:14.5px;line-height:1.42}
.badge{display:inline-block;margin-left:6px;padding:1px 7px;border:1px solid var(--green);border-radius:999px;
  color:var(--green);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;vertical-align:2px}
.off{opacity:.5}.off .pr{font-weight:400;font-size:14px}
.th{flex:none;position:relative;width:74px;height:74px;border-radius:12px;overflow:hidden;background:#ddd5ca}
.th img{display:block;width:100%;height:100%;object-fit:cover}
.play{position:absolute;right:6px;bottom:6px;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55)}
.play svg{width:10px;height:10px;margin-left:2px;fill:#fff}
.msg{padding:48px 0;color:var(--muted);text-align:center}

footer{max-width:680px;margin:0 auto;padding:28px 24px calc(36px + env(safe-area-inset-bottom));color:var(--muted);font-size:14px;text-align:center}
footer p{margin:4px 0}
footer a{color:var(--green)}
footer .logo{font-size:24px;margin-bottom:6px}

/* Ficha del plato */
#sheet{width:100%;max-width:560px;max-height:94dvh;margin:auto auto 0;padding:0;border:0;border-radius:22px 22px 0 0;
  background:var(--card);color:var(--ink);overflow:hidden}
#sheet[open]{animation:up .28s cubic-bezier(.2,.8,.2,1)}
#sheet::backdrop{background:rgba(25,25,20,.5)}
@keyframes up{from{transform:translateY(60px);opacity:.4}}
@media (min-width:700px){#sheet{margin:auto;border-radius:22px}}
.sin{max-height:94dvh;overflow-y:auto;overscroll-behavior:contain;padding-bottom:env(safe-area-inset-bottom)}
.x{position:absolute;top:12px;right:12px;z-index:2;display:grid;place-items:center;width:38px;height:38px;border:0;border-radius:50%;
  background:rgba(246,243,239,.92);color:var(--ink);font-size:24px;line-height:1;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.15)}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:#111}
.gal::-webkit-scrollbar{display:none}
.gal>*{flex:0 0 100%;width:100%;aspect-ratio:1/1;max-height:62dvh;scroll-snap-align:center;object-fit:cover;display:block}
.gal video{object-fit:contain;background:#111}
.dots{display:flex;justify-content:center;gap:6px;padding:10px 0 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--green)}
.sb{padding:22px 24px 30px}
.sb h2{margin:0 44px 0 0;font-size:25px;line-height:1.15}
.gal:not(:empty)~.sb h2{margin-right:0}
.sb p{margin:10px 0 0;color:var(--muted);font-size:16.5px;line-height:1.5}
.sb .pr{display:block;margin-top:16px;color:var(--green);font-size:21px}

/* WhatsApp */
.wa{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(18px + env(safe-area-inset-bottom));z-index:20;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.wa[hidden]{display:none}
.wa-btn{position:relative;isolation:isolate;display:grid;place-items:center;width:62px;height:62px;border-radius:50%;background:#25d366;
  box-shadow:0 6px 18px rgba(0,0,0,.28);animation:latido 2.4s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
.wa-btn svg{width:34px;height:34px;fill:#fff}
.wa-btn::before,.wa-btn::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:50%;background:#25d366;animation:onda 2.4s ease-out infinite}
.wa-btn::after{animation-delay:1.2s}
@keyframes onda{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.75);opacity:0}}
@keyframes latido{0%,30%,100%{transform:scale(1)}10%{transform:scale(1.1)}20%{transform:scale(.97)}}
.wa-globo{position:relative;max-width:min(250px,calc(100vw - 110px));margin-right:4px;padding:12px 34px 12px 15px;border-radius:18px 18px 4px 18px;
  background:#fff;color:#1e1e1b;font:500 15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;box-shadow:0 8px 26px rgba(0,0,0,.2);
  cursor:pointer;transform-origin:100% 100%;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.wa-globo[hidden]{display:none}
.wa-globo b{display:block;color:#128c4a;font-size:13px;margin-bottom:2px}
.wa-x{position:absolute;top:4px;right:4px;width:28px;height:28px;border:0;background:none;color:#999;font-size:20px;line-height:1;cursor:pointer}
@keyframes pop{from{transform:scale(.4);opacity:0}}
body.con-wa footer{padding-bottom:calc(110px + env(safe-area-inset-bottom))}
.wa-pedir{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:22px;padding:15px;border-radius:14px;background:#25d366;
  color:#fff;font:600 17px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-decoration:none}
.wa-pedir svg{width:22px;height:22px;fill:#fff}
.wa-pedir[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.wa-btn,.wa-btn::before,.wa-btn::after,.wa-globo{animation:none}}
</style>
</head>
<body>
<header class="top">
  <svg class="sprig" viewBox="0 0 200 200" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
    <defs><g id="lf"><path d="M0 0C12-9 34-9 46 0C34 9 12 9 0 0Z"/><path d="M3 0H40" stroke-width="1"/></g></defs>
    <path d="M206 14C160 40 120 72 86 118C68 142 56 166 50 196"/>
    <use href="#lf" transform="translate(182 27) rotate(-28)"/>
    <use href="#lf" transform="translate(170 33) rotate(128)"/>
    <use href="#lf" transform="translate(150 46) rotate(-14)"/>
    <use href="#lf" transform="translate(134 57) rotate(146)"/>
    <use href="#lf" transform="translate(114 76) rotate(4)"/>

    <use href="#lf" transform="translate(84 120) rotate(32)"/>
    <use href="#lf" transform="translate(70 142) rotate(188)"/>

    <path d="M124 66C122 76 118 84 112 90M96 104C94 112 90 118 84 122" stroke-width="1.2"/>
    <ellipse cx="108" cy="99" rx="10" ry="12" transform="rotate(-25 108 99)"/>
    <ellipse cx="80" cy="132" rx="9.5" ry="11.5" transform="rotate(-15 80 132)"/>
  </svg>
  <p class="logo" id="logo">SABORA</p>
  <h1>MENÚ</h1>
  <p class="sub" id="sub">Brunch &amp; Coffee</p>
</header>
<div class="rule"></div>
<nav class="tabs" id="tabs" aria-label="Categorías"></nav>
<main id="menu"><p class="msg">Cargando menú…</p></main>
<footer id="info"></footer>

<div class="wa" id="wa" hidden>
  <div class="wa-globo" id="wa-g" hidden><button class="wa-x" id="wa-x" aria-label="Cerrar mensaje">&times;</button><b>SABORA</b><span id="wa-t"></span></div>
  <a class="wa-btn" id="wa-a" target="_blank" rel="noopener" aria-label="Escríbenos por WhatsApp"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg></a>
</div>

<dialog id="sheet" aria-labelledby="s-t">
  <div class="sin" id="sin">
    <button class="x" id="s-x" aria-label="Cerrar" autofocus>&times;</button>
    <div class="gal" id="s-g"></div>
    <div class="dots" id="s-d"></div>
    <div class="sb"><h2 id="s-t"></h2><p id="s-p"></p><span class="pr" id="s-pr"></span><a class="wa-pedir" id="s-wa" target="_blank" rel="noopener" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>Pedir por WhatsApp</a></div>
  </div>
</dialog>

<script>
(function(){
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var slug=function(s){return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")};
var PLAY='<span class="play"><svg viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z"/></svg></span>';
var data;

window.__menu.then(function(d){data=d;render()}).catch(function(){
  $("#menu").innerHTML='<p class="msg">No se pudo cargar el menú. Revisa tu conexión e intenta de nuevo.</p>';
});

function precio(p){
  if(p.disponible===false)return"Agotado";
  var n=parseFloat(p.precio);
  if(!isFinite(n))return"";
  return(data.moneda?data.moneda+" ":"")+(Number.isInteger(n)?n:n.toFixed(2));
}
function thumb(p){
  var m=(p.media||[])[0];
  if(!m)return"";
  var src=m.tipo==="video"?m.poster:(m.thumb||m.src);
  return'<span class="th">'+(src?'<img src="'+esc(src)+'" alt="" width="74" height="74" loading="lazy" decoding="async">':"")+(m.tipo==="video"?PLAY:"")+"</span>";
}

function render(){
  document.title=data.restaurante+" · Menú";
  $("#logo").textContent=data.restaurante||"";
  $("#sub").textContent=data.eslogan||"";
  var cats=data.categorias||[];
  $("#tabs").innerHTML=cats.map(function(c){return'<a href="#'+slug(c.nombre)+'">'+esc(c.nombre)+"</a>"}).join("");
  $("#menu").innerHTML=cats.map(function(c,ci){
    return'<section id="'+slug(c.nombre)+'"><h2 class="cat">'+esc(c.nombre)+"</h2>"+(c.platos||[]).map(function(p,pi){
      var pr=precio(p);
      return'<button class="item'+(p.disponible===false?" off":"")+'" data-c="'+ci+'" data-p="'+pi+'"><span class="tx"><span class="row"><h3>'+esc(p.nombre)+
        (p.destacado?'<span class="badge">Recomendado</span>':"")+"</h3>"+(pr?'<span class="pr">'+esc(pr)+"</span>":"")+"</span>"+
        (p.descripcion?"<p>"+esc(p.descripcion)+"</p>":"")+"</span>"+thumb(p)+"</button>";
    }).join("")+"</section>";
  }).join("");

  var tel=(data.telefono||"").replace(/[^\d+]/g,"");
  var ig=(data.instagram||"").replace(/^@/,"");
  $("#info").innerHTML='<p class="logo">'+esc(data.restaurante)+"</p>"+
    (data.direccion?"<p>"+esc(data.direccion)+"</p>":"")+
    (data.horario?"<p>"+esc(data.horario)+"</p>":"")+
    (tel?'<p><a href="tel:'+esc(tel)+'">'+esc(data.telefono)+"</a></p>":"")+
    (ig?'<p><a href="https://instagram.com/'+esc(ig)+'" rel="noopener">@'+esc(ig)+"</a></p>":"");

  spy();
  whatsapp();
}

// Botón flotante de WhatsApp
function waNum(){return String(data.whatsapp||"").replace(/\D/g,"")}
function waLink(msg){return"https://wa.me/"+waNum()+(msg?"?text="+encodeURIComponent(msg):"")}
function whatsapp(){
  if(!waNum())return;
  var g=$("#wa-g");
  $("#wa").hidden=false;
  document.body.classList.add("con-wa");
  $("#wa-a").href=waLink(data.whatsapp_mensaje||"¡Hola "+data.restaurante+"! 👋 Vi el menú y quisiera pedir algo rico 😋");
  $("#wa-t").textContent=data.whatsapp_globo||"¿Se te antoja algo? 😋 ¡Escríbenos y pide aquí!";
  $("#wa-g b").textContent=data.restaurante||"";
  var visto=false;try{visto=sessionStorage.getItem("wa-globo")==="1"}catch(e){}
  if(!visto)setTimeout(function(){g.hidden=false},2500);
  var cerrar=function(){g.hidden=true;try{sessionStorage.setItem("wa-globo","1")}catch(e){}};
  $("#wa-x").addEventListener("click",function(e){e.stopPropagation();cerrar()});
  g.addEventListener("click",function(){cerrar();window.open($("#wa-a").href,"_blank","noopener")});
  $("#wa-a").addEventListener("click",cerrar);
}

// Resalta la categoría visible en las pestañas
function spy(){
  if(!("IntersectionObserver" in window))return;
  var links={};
  document.querySelectorAll("#tabs a").forEach(function(a){links[a.hash.slice(1)]=a});
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(!e.isIntersecting)return;
      var a=links[e.target.id];if(!a)return;
      document.querySelectorAll("#tabs a.on").forEach(function(x){x.classList.remove("on")});
      a.classList.add("on");
      var t=$("#tabs");t.scrollTo({left:a.offsetLeft-t.clientWidth/2+a.offsetWidth/2,behavior:"smooth"});
    });
  },{rootMargin:"-70px 0px -65% 0px"});
  document.querySelectorAll("main section").forEach(function(s){io.observe(s)});
}

// Ficha del plato
var sheet=$("#sheet"),gal=$("#s-g"),dots=$("#s-d");
$("#menu").addEventListener("click",function(e){
  var b=e.target.closest(".item");if(!b)return;
  open(data.categorias[b.dataset.c].platos[b.dataset.p]);
});
function open(p){
  var media=p.media||[];
  gal.innerHTML=media.map(function(m){
    return m.tipo==="video"
      ?'<video src="'+esc(m.src)+'"'+(m.poster?' poster="'+esc(m.poster)+'"':"")+' playsinline muted loop controls preload="metadata"></video>'
      :'<img src="'+esc(m.src)+'" alt="'+esc(p.nombre)+'" decoding="async">';
  }).join("");
  dots.innerHTML=media.length>1?media.map(function(_,i){return"<i"+(i?"":' class="on"')+"></i>"}).join(""):"";
  dots.hidden=media.length<2;
  $("#s-t").innerHTML=esc(p.nombre)+(p.destacado?' <span class="badge">Recomendado</span>':"");
  $("#s-p").textContent=p.descripcion||"";
  $("#s-pr").textContent=precio(p);
  var w=$("#s-wa"),pr=precio(p);
  w.hidden=!waNum()||p.disponible===false;
  if(!w.hidden)w.href=waLink("¡Hola "+data.restaurante+"! 👋 Quisiera pedir: "+p.nombre+(pr?" ("+pr+")":""));
  $("#sin").scrollTop=0;
  sheet.showModal();
  var v=gal.firstElementChild;
  if(v&&v.tagName==="VIDEO"){var pr=v.play();if(pr&&pr.catch)pr.catch(function(){})}
  history.pushState({sheet:1},"");
}
gal.addEventListener("scroll",function(){
  var i=Math.round(gal.scrollLeft/gal.clientWidth);
  [].forEach.call(dots.children,function(d,j){d.classList.toggle("on",i===j)});
  [].forEach.call(gal.children,function(m,j){if(m.tagName==="VIDEO"&&j!==i)m.pause()});
},{passive:true});
$("#s-x").addEventListener("click",function(){sheet.close()});
sheet.addEventListener("click",function(e){if(e.target===sheet)sheet.close()});
sheet.addEventListener("close",function(){
  gal.innerHTML="";
  if(history.state&&history.state.sheet)history.back();
});
// Botón "atrás" de Android / gesto de iPhone cierra la ficha
addEventListener("popstate",function(){if(sheet.open)sheet.close()});
if("serviceWorker"in navigator)addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
})();
</script>
</body>
</html>
