<head>

<title>SABORA · Menú</title>

<script>window.__menu=fetch("menu.json",{cache:"no-cache"}).then(function(r){if(!r.ok)throw r.status;return r.json()});</script>
<style>
:root{
  --paper:#ebe7e1;--card:#f6f3ef;--ink:#1e1e1b;--muted:#5f5b55;--green:#2f5f35;--line:#cdc6bb;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua","Noto Serif",Georgia,serif;
  --display:Didot,"Bodoni 72","Bodoni MT","Noto Serif Display",var(--serif);
  --script:"Snell Roundhand","Apple Chancery","Segoe Script","Brush Script MT",cursive;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  /* Espacio abajo para botones fijos. En Safari de iPhone, con las barras escondidas, el primer toque
     cerca del borde de abajo solo vuelve a mostrar las barras; esa zona mide ~2.5 veces la zona segura
     (que solo existe mientras las barras están escondidas), así que los botones suben por encima. */
  --abajo:calc(env(safe-area-inset-bottom) * 2.5);
}
@media (display-mode:standalone){:root{--abajo:env(safe-area-inset-bottom)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scroll-behavior:smooth;background:var(--paper)}
html:has(dialog[open]){overflow:hidden}
body{margin:0;min-height:100dvh;font-family:var(--serif);color:var(--ink);-webkit-tap-highlight-color:transparent;
  background:var(--paper) radial-gradient(120% 60% at 15% 0%,rgba(255,255,255,.55),transparent 60%)}

.top{position:relative;max-width:680px;margin:0 auto;padding:calc(30px + env(safe-area-inset-top)) 24px 20px;overflow:hidden}
.sprig{position:absolute;top:calc(env(safe-area-inset-top) - 10px);right:-26px;width:min(46vw,210px);height:auto;color:var(--green);pointer-events:none}
.logo{margin:0;font-family:var(--script);color:var(--green);font-size:32px;letter-spacing:.08em}
h1{margin:2px 0 6px;font-family:var(--display);font-weight:400;font-size:clamp(68px,23vw,112px);line-height:.92;letter-spacing:-.01em}
.sub{margin:0 0 0 .2em;font-size:19px}
.rule{max-width:640px;height:6px;margin:0 auto;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);opacity:.55}

.tabs{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none;
  background:rgba(235,231,225,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;padding:9px 15px;border:1px solid var(--line);border-radius:999px;background:var(--card);
  color:var(--green);font-size:12.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;text-decoration:none}
.tabs a.on{background:var(--green);border-color:var(--green);color:#fff}

main{max-width:680px;margin:0 auto;padding:0 16px 24px}
section{scroll-margin-top:62px;padding-top:22px}
.cat{margin:0 4px 2px;padding-bottom:8px;border-bottom:1px solid var(--ink);color:var(--green);
  font-size:22px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.item{display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.abrir{display:flex;align-items:center;gap:14px;flex:1;min-width:0;padding:16px 4px;border:0;
  background:none;color:inherit;font:inherit;text-align:left;cursor:pointer;touch-action:manipulation}
.abrir:active{background:rgba(47,95,53,.07)}
.mas{flex:none;display:grid;place-items:center;width:42px;height:42px;margin-right:5px;padding:0;border:1.5px solid var(--green);border-radius:50%;
  background:#fff;color:var(--green);box-shadow:0 1px 4px rgba(0,0,0,.08);cursor:pointer;touch-action:manipulation}
.mas svg{width:20px;height:20px}
.mas.en{background:var(--green);color:#fff}
.mas.pop{animation:tap .35s ease}
@keyframes tap{40%{transform:scale(1.2)}}
.tip{display:flex;align-items:center;gap:10px;margin:18px 4px 0;padding:11px 14px;border-radius:14px;background:rgba(47,95,53,.09);
  color:var(--green);font:500 14.5px/1.35 var(--ui)}
.tip i{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff}
.tip svg{width:14px;height:14px}
.tx{flex:1;min-width:0}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.item h3{margin:0;font-size:17.5px;font-weight:700}
.pr{flex:none;font-size:16px;font-weight:700;white-space:nowrap}
.item p{margin:5px 0 0;color:var(--muted);font-size:14.5px;line-height:1.42}
.badge{display:inline-block;margin-left:6px;padding:1px 7px;border:1px solid var(--green);border-radius:999px;
  color:var(--green);font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;vertical-align:2px}
.off{opacity:.5}.off .pr{font-weight:400;font-size:14px}
.th{flex:none;position:relative;width:74px;height:74px;border-radius:12px;overflow:hidden;background:#ddd5ca}
.th img{display:block;width:100%;height:100%;object-fit:cover}
.play{position:absolute;right:6px;bottom:6px;display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.55)}
.play svg{width:10px;height:10px;margin-left:2px;fill:#fff}
.msg{padding:48px 0;color:var(--muted);text-align:center}

footer{max-width:680px;margin:0 auto;padding:28px 24px calc(36px + env(safe-area-inset-bottom));color:var(--muted);font-size:14px;text-align:center}
footer p{margin:4px 0}
footer a{color:var(--green)}
footer .logo{font-size:24px;margin-bottom:6px}
footer .aviso{margin-top:14px;font-size:12px;opacity:.75}

/* Ficha del plato */
#sheet,#cart{width:100%;max-width:560px;max-height:94dvh;margin:auto auto 0;padding:0;border:0;border-radius:22px 22px 0 0;
  background:var(--card);color:var(--ink);overflow:hidden}
#sheet[open],#cart[open]{animation:up .28s cubic-bezier(.2,.8,.2,1)}
#sheet::backdrop,#cart::backdrop{background:rgba(25,25,20,.5)}
@keyframes up{from{transform:translateY(60px);opacity:.4}}
@media (min-width:700px){#sheet,#cart{margin:auto;border-radius:22px}}
.sin{max-height:94dvh;overflow-y:auto;overscroll-behavior:contain;padding-bottom:var(--abajo)}
.x{position:absolute;top:12px;right:12px;z-index:2;display:grid;place-items:center;width:38px;height:38px;border:0;border-radius:50%;
  background:rgba(246,243,239,.92);color:var(--ink);font-size:24px;line-height:1;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.15)}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;background:#111}
.gal::-webkit-scrollbar{display:none}
.gal>*{flex:0 0 100%;width:100%;aspect-ratio:1/1;max-height:62dvh;scroll-snap-align:center;object-fit:cover;display:block}
.gal video{object-fit:contain;background:#111}
.dots{display:flex;justify-content:center;gap:6px;padding:10px 0 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--green)}
.sb{padding:22px 24px 30px}
.sb h2{margin:0 44px 0 0;font-size:25px;line-height:1.15}
.gal:not(:empty)~.sb h2{margin-right:0}
.sb p{margin:10px 0 0;color:var(--muted);font-size:16.5px;line-height:1.5}
.sb .pr{display:block;margin-top:16px;color:var(--green);font-size:21px}

/* WhatsApp */
.wa{position:fixed;right:calc(16px + env(safe-area-inset-right));bottom:calc(18px + var(--abajo));z-index:20;display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.wa[hidden]{display:none}
.wa-btn{position:relative;isolation:isolate;display:grid;place-items:center;width:62px;height:62px;border-radius:50%;background:#25d366;
  box-shadow:0 6px 18px rgba(0,0,0,.28);animation:latido 2.4s ease-in-out infinite;-webkit-tap-highlight-color:transparent}
.wa-btn svg{width:34px;height:34px;fill:#fff}
.wa-btn::before,.wa-btn::after{content:"";position:absolute;inset:0;z-index:-1;border-radius:50%;background:#25d366;animation:onda 2.4s ease-out infinite}
.wa-btn::after{animation-delay:1.2s}
@keyframes onda{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.75);opacity:0}}
@keyframes latido{0%,30%,100%{transform:scale(1)}10%{transform:scale(1.1)}20%{transform:scale(.97)}}
.wa-globo{position:relative;max-width:min(250px,calc(100vw - 110px));margin-right:4px;padding:12px 34px 12px 15px;border-radius:18px 18px 4px 18px;
  background:#fff;color:#1e1e1b;font:500 15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;box-shadow:0 8px 26px rgba(0,0,0,.2);
  cursor:pointer;transform-origin:100% 100%;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.wa-globo[hidden]{display:none}
.wa-globo b{display:block;color:#128c4a;font-size:13px;margin-bottom:2px}
.wa-x{position:absolute;top:4px;right:4px;width:28px;height:28px;border:0;background:none;color:#999;font-size:20px;line-height:1;cursor:pointer}
@keyframes pop{from{transform:scale(.4);opacity:0}}
body.con-wa footer{padding-bottom:calc(110px + var(--abajo))}
.wa-pedir{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:22px;padding:15px;border-radius:14px;background:#25d366;
  color:#fff;font:600 17px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-decoration:none}
.wa-pedir svg{width:22px;height:22px;fill:#fff}
.wa-pedir[hidden]{display:none}

/* Pedido (carrito) */
.qn{color:var(--green);margin-right:6px}
.qn:empty{display:none}
.add{display:flex;gap:10px;margin-top:22px}
.add[hidden]{display:none}
.qty{flex:none;display:flex;align-items:center;border:1px solid var(--line);border-radius:14px;background:#fff}
.qty button{width:44px;height:50px;border:0;background:none;color:var(--green);font:600 24px/1 var(--ui);cursor:pointer;touch-action:manipulation}
.qty span{min-width:22px;text-align:center;font:600 17px var(--ui)}
.quitar-todo{display:flex;align-items:center;justify-content:center;width:100%;min-height:48px;margin-top:12px;border:1.5px solid #ecc8c3;border-radius:14px;
  background:#fff;color:#b42318;font:600 15.5px var(--ui);cursor:pointer;touch-action:manipulation}
.quitar-todo[hidden]{display:none}
.add-btn{flex:1;min-height:52px;border:0;border-radius:14px;background:var(--green);color:#fff;font:600 16.5px var(--ui);cursor:pointer;touch-action:manipulation}
.cart-bar{position:fixed;left:calc(16px + env(safe-area-inset-left));right:calc(16px + env(safe-area-inset-right));bottom:calc(18px + var(--abajo));z-index:20;
  display:flex;align-items:center;gap:10px;max-width:560px;margin:0 auto;height:56px;padding:0 16px 0 10px;border:0;border-radius:16px;background:var(--green);color:#fff;
  font:600 16px var(--ui);box-shadow:0 8px 22px rgba(0,0,0,.25);cursor:pointer;touch-action:manipulation}
.cart-bar[hidden]{display:none}
.cart-bar.bump{animation:bump .4s ease}
@keyframes bump{40%{transform:scale(1.05)}}
.cb-n{display:grid;place-items:center;min-width:30px;height:30px;padding:0 8px;border-radius:999px;background:#fff;color:var(--green);font-size:15px}
.cb-t{margin-left:auto;white-space:nowrap}
.lista{margin:14px 0 0;padding:0;list-style:none}
.lista li{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.lista .nm{flex:1;min-width:0}
.lista .nm b{display:block;font-size:16.5px;line-height:1.25}
.lista .nm small{color:var(--muted);font-size:14px}
.lista .qty button{width:36px;height:40px;font-size:21px}
.lista .lt{min-width:62px;text-align:right;font-weight:700;white-space:nowrap}
.tot{display:flex;justify-content:space-between;margin:14px 0 0;font-size:19px;font-weight:700}
.tot b{color:var(--green)}
.f .l{display:block;margin:18px 0 6px;color:var(--muted);font:600 13.5px var(--ui)}
.f input,.f textarea{display:block;width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:16px var(--ui)}
.f textarea{min-height:66px;resize:vertical}
.f input:focus,.f textarea:focus{outline:2px solid var(--green);outline-offset:-1px;border-color:transparent}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button,.ubic{min-height:50px;padding:8px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font:600 15px var(--ui);cursor:pointer;touch-action:manipulation}
.seg button[aria-pressed=true]{border-color:var(--green);background:var(--green);color:#fff}
.ubic{width:100%;margin-top:8px;color:var(--green)}
.ubic:disabled{opacity:.7;cursor:default}
.geo{margin:8px 0 0;color:var(--muted);font:14px/1.4 var(--ui)}
.geo:empty{display:none}
.geo.err{color:#b42318}
.f .wa-pedir{width:100%;border:0;cursor:pointer}
.vaciar{display:block;margin:14px auto 0;padding:8px;border:0;background:none;color:var(--muted);font:14px var(--ui);text-decoration:underline;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--abajo));z-index:30;max-width:calc(100vw - 32px);padding:11px 18px;border-radius:999px;
  background:#1e1e1b;color:#fff;font:600 14.5px var(--ui);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.25);transform:translateX(-50%);animation:sube .3s ease}
@keyframes sube{from{opacity:0;transform:translate(-50%,12px)}}
.toast[hidden]{display:none}
.toast{pointer-events:none;display:flex;align-items:center;justify-content:center;width:max-content} /* no tapa los platos de abajo; solo "Deshacer" se puede tocar */
.toast button{pointer-events:auto;margin-left:14px;padding:4px 2px;border:0;background:none;color:#9fdcaa;font:700 14.5px var(--ui);text-decoration:underline;cursor:pointer}
/* Deslizar a la derecha para quitar un plato del pedido */
.item,.lista li{position:relative;overflow:hidden;touch-action:pan-y;touch-action:pan-y pinch-zoom}
.item>*,.lista li>*{transform:translateX(var(--dx,0px));transition:transform .2s ease}
.arrastra>*{transition:none}
.arrastra,.sale{background:linear-gradient(90deg,#f9e3e0 var(--dx,0px),transparent var(--dx,0px))}
.arrastra::before,.sale::before{content:"🗑 Quitar";position:absolute;left:0;top:0;bottom:0;display:flex;align-items:center;width:var(--dx,0px);padding-left:12px;
  overflow:hidden;white-space:nowrap;box-sizing:border-box;color:#b42318;font:600 14px var(--ui);opacity:.5}
.borra::before,.sale::before{opacity:1}
.borra .mas{background:#b42318;border-color:#b42318;color:#fff}
.mas svg{transition:transform .15s ease}
.borra .mas svg{transform:rotate(45deg)}
@media (prefers-reduced-motion:reduce){.wa-btn,.wa-btn::before,.wa-btn::after,.wa-globo,.cart-bar.bump,.toast,.mas.pop{animation:none}}
</style>
</head>

<footer id="info"></footer>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="wa-ico" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></symbol></svg>
<div class="wa" id="wa" hidden>
  <div class="wa-globo" id="wa-g" hidden><button class="wa-x" id="wa-x" aria-label="Cerrar mensaje">&times;</button><b>SABORA</b><span id="wa-t"></span></div>
  <a class="wa-btn" id="wa-a" target="_blank" rel="noopener" aria-label="Escríbenos por WhatsApp"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#wa-ico"/></svg></a>
</div>

<dialog id="sheet" aria-labelledby="s-t">
  <div class="sin" id="sin">
    <button class="x" id="s-x" aria-label="Cerrar" autofocus>&times;</button>
    <div class="gal" id="s-g"></div>
    <div class="dots" id="s-d"></div>
    <div class="sb"><h2 id="s-t"></h2><p id="s-p"></p><span class="pr" id="s-pr"></span><div class="add" id="s-add" hidden><span class="qty"><button type="button" id="s-menos" aria-label="Uno menos">−</button><span id="s-n">1</span><button type="button" id="s-mas" aria-label="Uno más">+</button></span><button type="button" class="add-btn" id="s-ok">Agregar al pedido</button></div><button type="button" class="quitar-todo" id="s-quitar" hidden></button></div>
  </div>
</dialog>

<button class="cart-bar" id="cart-bar" hidden><span class="cb-n" id="cb-n">0</span><span>Ver mi pedido</span><span class="cb-t" id="cb-t"></span></button>
<p class="toast" id="toast" role="status" hidden></p>

<dialog id="cart" aria-labelledby="c-h">
  <div class="sin" id="c-sin">
    <button class="x" id="c-x" aria-label="Cerrar">&times;</button>
    <form class="sb f" id="c-f" novalidate>
      <h2 id="c-h">Tu pedido</h2>
      <ul class="lista" id="c-lista"></ul>
      <p class="tot"><span>Total</span><b id="c-tot"></b></p>
      <p class="geo">Desliza un plato a la derecha para quitarlo.</p>
      <p class="geo" id="c-sp" hidden>Algunos precios te los confirmamos por WhatsApp.</p>
      <span class="l">¿Cómo lo quieres?</span>
      <div class="seg" id="c-tipo"><button type="button" data-t="local" aria-pressed="false">🍽️ En el local</button><button type="button" data-t="domicilio" aria-pressed="false">🛵 A domicilio</button></div>
      <p class="geo" id="c-geo"></p>
      <div id="c-loc" hidden><label class="l" for="c-mesa">Número de mesa (opcional)</label><input type="text" id="c-mesa" maxlength="10" placeholder="Si no tienes mesa, déjalo vacío"></div>
      <label class="l" for="c-nom" id="c-nom-l">Tu nombre</label>
      <input type="text" id="c-nom" autocomplete="name" placeholder="Para llamarte cuando esté listo" maxlength="60">
      <div id="c-dom" hidden><label class="l" for="c-dir">Dirección o punto de referencia</label><textarea id="c-dir" autocomplete="street-address" maxlength="300" placeholder="Colonia, calle, casa, color del portón…"></textarea><button type="button" class="ubic" id="c-ubic">📍 Enviar mi ubicación GPS</button></div>
      <label class="l" for="c-nota">Nota (opcional)</label>
      <input type="text" id="c-nota" maxlength="200" placeholder="Ej. sin cebolla, poco hielo">
      <button type="submit" class="wa-pedir"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#wa-ico"/></svg>Enviar pedido por WhatsApp</button>
      <button type="button" class="vaciar" id="c-vaciar">Vaciar pedido</button>
    </form>
  </div>
</dialog>

<script>
(function(){
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var slug=function(s){return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")};
var MAS='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>';
var PLAY='<span class="play"><svg viewBox="0 0 10 10"><path d="M0 0L10 5L0 10Z"/></svg></span>';
var data;

window.__menu.then(function(d){data=d;render()}).catch(function(){
  $("#menu").innerHTML='<p class="msg">No se pudo cargar el menú. Revisa tu conexión e intenta de nuevo.</p>';
});

function fmt(n){return(data.moneda?data.moneda+" ":"")+(Number.isInteger(n)?n:n.toFixed(2))}
function precio(p){
  if(p.disponible===false)return"Agotado";
  var n=parseFloat(p.precio);
  return isFinite(n)?fmt(n):"";
}
function thumb(p){
  var m=(p.media||[])[0];
  if(!m)return"";
  var src=m.tipo==="video"?m.poster:(m.thumb||m.src);
  return'<span class="th">'+(src?'<img src="'+esc(src)+'" alt="" width="74" height="74" loading="lazy" decoding="async">':"")+(m.tipo==="video"?PLAY:"")+"</span>";
}

function render(){
  document.title=data.restaurante+" · Menú";
  $("#logo").textContent=data.restaurante||"";
  $("#sub").textContent=data.eslogan||"";
  var cats=data.categorias||[];
  $("#tabs").innerHTML=cats.map(function(c){return'<a href="#'+slug(c.nombre)+'">'+esc(c.nombre)+"</a>"}).join("");
  porId={};
  var pide=!!waNum();
  $("#menu").innerHTML=(pide?'<p class="tip"><i>'+MAS+"</i><span>Toca <b>+</b> en cada plato para armar tu pedido y envíalo por WhatsApp.</span></p>":"")+cats.map(function(c,ci){
    return'<section id="'+slug(c.nombre)+'"><h2 class="cat">'+esc(c.nombre)+"</h2>"+(c.platos||[]).map(function(p,pi){
      var pr=precio(p);
      if(!p.id)p.id="p"+ci+"-"+pi;
      porId[p.id]=p;
      return'<div class="item'+(p.disponible===false?" off":"")+'" data-c="'+ci+'" data-p="'+pi+'"><button class="abrir"><span class="tx"><span class="row"><h3><span class="qn"></span>'+esc(p.nombre)+
        (p.destacado?'<span class="badge">Recomendado</span>':"")+"</h3>"+(pr?'<span class="pr">'+esc(pr)+"</span>":"")+"</span>"+
        (p.descripcion?"<p>"+esc(p.descripcion)+"</p>":"")+"</span>"+thumb(p)+"</button>"+
        (pide&&p.disponible!==false?'<button class="mas" aria-label="Agregar '+esc(p.nombre)+' al pedido">'+MAS+"</button>":"")+"</div>";
    }).join("")+"</section>";
  }).join("");

  var tel=(data.telefono||"").replace(/[^\d+]/g,"");
  var actualizado=new Date(document.lastModified); // fecha de publicación de esta página (sirve para saber si el teléfono ya tiene la última versión)
  var ig=(data.instagram||"").replace(/^@/,"");
  $("#info").innerHTML='<p class="logo">'+esc(data.restaurante)+"</p>"+
    (data.direccion?"<p>"+esc(data.direccion)+"</p>":"")+
    (data.horario?"<p>"+esc(data.horario)+"</p>":"")+
    (tel?'<p><a href="tel:'+esc(tel)+'">'+esc(data.telefono)+"</a></p>":"")+
    (ig?'<p><a href="https://instagram.com/'+esc(ig)+'" rel="noopener">@'+esc(ig)+"</a></p>":"")+
    (isFinite(actualizado)?'<p class="aviso">Menú actualizado: '+esc(actualizado.toLocaleString("es-HN",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}))+"</p>":"");

  spy();
  whatsapp();
  cargarPedido();
}

// Botón flotante de WhatsApp
function waNum(){return String(data.whatsapp||"").replace(/\D/g,"")}
// api.whatsapp.com y no wa.me: la redirección de wa.me convierte los emojis en �
function waLink(msg){return"https://api.whatsapp.com/send?phone="+waNum()+(msg?"&text="+encodeURIComponent(msg):"")}
function waBoton(){return!!waNum()&&data.whatsapp_boton===true}
function whatsapp(){
  if(!waNum())return;
  document.body.classList.add("con-wa"); // espacio abajo para la barra del pedido
  if(!waBoton())return; // el botón flotante se enciende o apaga desde el editor
  var g=$("#wa-g");
  $("#wa").hidden=false;
  $("#wa-a").href=waLink(data.whatsapp_mensaje||"¡Hola "+data.restaurante+"! 👋 Vi el menú y quisiera pedir algo deli 😋");
  $("#wa-t").textContent=data.whatsapp_globo||"¿Se te antoja algo? 😋 ¡Escríbenos y pide aquí!";
  $("#wa-g b").textContent=data.restaurante||"";
  var visto=false;try{visto=sessionStorage.getItem("wa-globo")==="1"}catch(e){}
  if(!visto)setTimeout(function(){g.hidden=false},2500);
  var cerrar=function(){g.hidden=true;try{sessionStorage.setItem("wa-globo","1")}catch(e){}};
  $("#wa-x").addEventListener("click",function(e){e.stopPropagation();cerrar()});
  g.addEventListener("click",function(){cerrar();window.open($("#wa-a").href,"_blank","noopener")});
  $("#wa-a").addEventListener("click",cerrar);
}

// Resalta la categoría visible en las pestañas
function spy(){
  if(!("IntersectionObserver" in window))return;
  var links={};
  document.querySelectorAll("#tabs a").forEach(function(a){links[a.hash.slice(1)]=a});
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){
      if(!e.isIntersecting)return;
      var a=links[e.target.id];if(!a)return;
      document.querySelectorAll("#tabs a.on").forEach(function(x){x.classList.remove("on")});
      a.classList.add("on");
      var t=$("#tabs");t.scrollTo({left:a.offsetLeft-t.clientWidth/2+a.offsetWidth/2,behavior:"smooth"});
    });
  },{rootMargin:"-70px 0px -65% 0px"});
  document.querySelectorAll("main section").forEach(function(s){io.observe(s)});
}

// Ficha del plato
var sheet=$("#sheet"),gal=$("#s-g"),dots=$("#s-d");
$("#menu").addEventListener("click",function(e){
  if(Date.now()-movido<400)return;
  var b=e.target.closest(".item");if(!b)return;
  var p=data.categorias[b.dataset.c].platos[b.dataset.p],m=e.target.closest(".mas");
  if(!m)return open(p);
  sumar(p,1);
  m.classList.remove("pop");void m.offsetWidth;m.classList.add("pop");
});
function open(p){
  var media=p.media||[];
  gal.innerHTML=media.map(function(m){
    return m.tipo==="video"
      ?'<video src="'+esc(m.src)+'"'+(m.poster?' poster="'+esc(m.poster)+'"':"")+' playsinline muted loop controls preload="metadata"></video>'
      :'<img src="'+esc(m.src)+'" alt="'+esc(p.nombre)+'" decoding="async">';
  }).join("");
  dots.innerHTML=media.length>1?media.map(function(_,i){return"<i"+(i?"":' class="on"')+"></i>"}).join(""):"";
  dots.hidden=media.length<2;
  $("#s-t").innerHTML=esc(p.nombre)+(p.destacado?' <span class="badge">Recomendado</span>':"");
  $("#s-p").textContent=p.descripcion||"";
  $("#s-pr").textContent=precio(p);
  actual=p;cant=1;pintarCant();
  var q=pedido[p.id]||0,bq=$("#s-quitar");
  bq.hidden=!q;
  bq.textContent=q?"🗑 Quitar del pedido ("+q+"×)":"";
  $("#s-add").hidden=!waNum()||p.disponible===false;
  $("#sin").scrollTop=0;
  sheet.showModal();
  var v=gal.firstElementChild;
  if(v&&v.tagName==="VIDEO"){var pr=v.play();if(pr&&pr.catch)pr.catch(function(){})}
  history.pushState({sheet:1},"");
}
gal.addEventListener("scroll",function(){
  var i=Math.round(gal.scrollLeft/gal.clientWidth);
  [].forEach.call(dots.children,function(d,j){d.classList.toggle("on",i===j)});
  [].forEach.call(gal.children,function(m,j){if(m.tagName==="VIDEO"&&j!==i)m.pause()});
},{passive:true});
$("#s-x").addEventListener("click",function(){sheet.close()});
sheet.addEventListener("click",function(e){if(e.target===sheet)sheet.close()});
sheet.addEventListener("close",function(){
  gal.innerHTML="";
  if(history.state&&history.state.sheet)history.back();
});
// Botón "atrás" de Android / gesto de iPhone cierra la ficha y el pedido
addEventListener("popstate",function(){if(sheet.open)sheet.close();if(cart.open)cart.close()});

// ===== Pedido (carrito): varios platos en un solo mensaje de WhatsApp =====
var porId={};       // id del plato -> plato
var pedido={};      // id del plato -> cantidad
var actual=null,cant=1;
var cliente=null;   // ubicación GPS del cliente {lat,lng,acc}
var tipo="",tipoManual=false,buscando=false;
var cart=$("#cart"),bar=$("#cart-bar");
var LS=function(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}};

function lineas(){
  return Object.keys(pedido).map(function(id){
    var p=porId[id],n=parseFloat(p.precio);
    return{p:p,q:pedido[id],n:isFinite(n)?n:null};
  });
}
function total(ls){return ls.reduce(function(s,l){return s+(l.n==null?0:l.n*l.q)},0)}

function cargarPedido(){
  var g={};try{g=JSON.parse(LS("menu-pedido")||"{}")}catch(e){}
  pedido={};
  for(var id in g){var p=porId[id];if(p&&p.disponible!==false&&g[id]>0)pedido[id]=Math.min(99,g[id]|0)}
  actualizar();
}
function actualizar(){
  LS("menu-pedido",Object.keys(pedido).length?JSON.stringify(pedido):null);
  var ls=lineas(),n=ls.reduce(function(s,l){return s+l.q},0);
  bar.hidden=!n||!waNum();
  $("#wa").hidden=!!n||!waBoton(); // con pedido, el botón suelto de WhatsApp se oculta para que no manden un mensaje sin la orden
  $("#cb-n").textContent=n;
  $("#cb-t").textContent=n?fmt(total(ls)):"";
  document.querySelectorAll("#menu .item").forEach(function(b){
    var q=pedido[data.categorias[b.dataset.c].platos[b.dataset.p].id];
    b.querySelector(".qn").textContent=q?q+"×":"";
    var m=b.querySelector(".mas");if(m)m.classList.toggle("en",!!q);
  });
}

var toastT;
function avisar(t,deshacer){
  var e=$("#toast");
  (cart.open?cart:document.body).appendChild(e);
  e.textContent=t;
  if(deshacer){
    var b=document.createElement("button");b.type="button";b.textContent="Deshacer";
    b.addEventListener("click",function(){e.hidden=true;deshacer()});
    e.appendChild(b);
  }
  e.hidden=false;
  clearTimeout(toastT);toastT=setTimeout(function(){e.hidden=true},deshacer?5000:2600);
}

// Cantidad y "Agregar" en la ficha del plato
function pintarCant(){
  var n=parseFloat(actual.precio);
  $("#s-n").textContent=cant;
  $("#s-ok").textContent=isFinite(n)?"Agregar · "+fmt(n*cant):"Agregar al pedido";
}
$("#s-menos").addEventListener("click",function(){if(cant>1){cant--;pintarCant()}});
$("#s-mas").addEventListener("click",function(){if(cant<99){cant++;pintarCant()}});
$("#s-quitar").addEventListener("click",function(){
  sheet.close();
  quitar(actual.id);
});
$("#s-ok").addEventListener("click",function(){
  sheet.close();
  sumar(actual,cant);
});
function sumar(p,q){
  pedido[p.id]=Math.min(99,(pedido[p.id]||0)+q);
  actualizar();
  avisar("✓ Agregado: "+q+"× "+p.nombre);
  bar.classList.remove("bump");void bar.offsetWidth;bar.classList.add("bump");
}

// Ventana "Tu pedido"
bar.addEventListener("click",function(){
  pintarPedido();
  var nom=$("#c-nom"),dir=$("#c-dir");
  if(!nom.value)nom.value=LS("menu-nombre")||"";
  if(!dir.value)dir.value=LS("menu-direccion")||"";
  $("#c-sin").scrollTop=0;
  cart.showModal();
  history.pushState({sheet:1},"");
  if(hayLocal())ubicar();
});
function pintarPedido(){
  var ls=lineas();
  if(!ls.length){if(cart.open)cart.close();return}
  $("#c-lista").innerHTML=ls.map(function(l){
    return'<li data-id="'+esc(l.p.id)+'"><span class="nm"><b>'+esc(l.p.nombre)+"</b><small>"+(l.n==null?"Precio por confirmar":esc(fmt(l.n))+" c/u")+
      '</small></span><span class="qty"><button type="button" data-d="-1" aria-label="Uno menos">−</button><span>'+l.q+
      '</span><button type="button" data-d="1" aria-label="Uno más">+</button></span><span class="lt">'+(l.n==null?"—":esc(fmt(l.n*l.q)))+"</span></li>";
  }).join("");
  $("#c-tot").textContent=fmt(total(ls));
  $("#c-sp").hidden=!ls.some(function(l){return l.n==null});
}
$("#c-lista").addEventListener("click",function(e){
  if(Date.now()-movido<400)return;
  var b=e.target.closest("button[data-d]");if(!b)return;
  var id=b.closest("li").dataset.id,q=(pedido[id]||0)+(+b.dataset.d);
  if(q>0)pedido[id]=Math.min(99,q);else delete pedido[id];
  actualizar();pintarPedido();
});
$("#c-x").addEventListener("click",function(){cart.close()});
cart.addEventListener("click",function(e){if(e.target===cart)cart.close()});
cart.addEventListener("close",function(){if(history.state&&history.state.sheet)history.back()});
$("#c-vaciar").addEventListener("click",function(){
  if(!confirm("¿Vaciar todo el pedido?"))return;
  pedido={};actualizar();cart.close();
});

// Deslizar a la derecha quita el plato del pedido (en el menú y en "Tu pedido")
var movido=0;
function quitar(id){
  var q=pedido[id],p=porId[id];if(!q)return;
  delete pedido[id];
  actualizar();
  if(cart.open)pintarPedido();
  avisar("Quitaste "+q+"× "+p.nombre,function(){pedido[id]=q;actualizar();if(cart.open)pintarPedido()});
}
function deslizable(cont,sel,idDe,saleEntero){
  var el=null,id,x0,y0,dx=0,moviendo=false;
  // Hay que deslizar ~1/3 del plato; si se empieza cerca del borde derecho (sobre el +), basta con lo que queda hasta el borde
  var limite=function(t){return Math.min(110,t.offsetWidth*.3,Math.max(24,(innerWidth-x0)*.6))};
  cont.addEventListener("touchstart",function(e){
    el=null;
    if(e.touches.length!==1)return;
    var t=e.target.closest(sel);if(!t)return;
    id=idDe(t);if(!pedido[id])return;
    el=t;x0=e.touches[0].clientX;y0=e.touches[0].clientY;dx=0;moviendo=false;
  },{passive:true});
  cont.addEventListener("touchmove",function(e){
    if(!el)return;
    var mx=e.touches[0].clientX-x0,my=e.touches[0].clientY-y0;
    if(!moviendo){
      var ax=Math.abs(mx),ay=Math.abs(my);
      if(ax<6&&ay<6)return; // un toque siempre tiembla un poco
      if(ay>=ax||mx<0){el=null;return} // hacia arriba/abajo o a la izquierda: no es este gesto
      if(ax<ay*1.5)return; // en diagonal: todavía no se sabe
      // Hacia la derecha: se reclama el gesto ya. En iPhone, si la página no lo reclama en los primeros
      // milímetros, Safari empieza a desplazar la página y cancela el gesto.
      if(e.cancelable)e.preventDefault();
      if(mx<8)return;
      moviendo=true;el.classList.add("arrastra");
    }
    if(e.cancelable)e.preventDefault(); // que el navegador no lo tome como desplazamiento ni como "atrás"
    dx=Math.max(0,mx);
    el.style.setProperty("--dx",dx+"px");
    el.classList.toggle("borra",dx>limite(el));
  },{passive:false});
  function fin(e){
    if(!el)return;
    var t=el;el=null;
    if(!moviendo)return;
    movido=Date.now();
    var borra=e.type==="touchend"&&dx>limite(t);
    t.classList.remove("arrastra","borra");
    if(!borra)return t.style.removeProperty("--dx");
    if(!saleEntero){t.style.removeProperty("--dx");return quitar(id)}
    t.classList.add("sale");t.style.setProperty("--dx",t.offsetWidth+"px");
    setTimeout(function(){quitar(id)},180);
  }
  cont.addEventListener("touchend",fin);
  cont.addEventListener("touchcancel",fin);
}
deslizable($("#menu"),".item",function(t){return data.categorias[t.dataset.c].platos[t.dataset.p].id},false);
deslizable($("#c-lista"),"li",function(t){return t.dataset.id},true);

// En el local o a domicilio
function ponerTipo(t){
  tipo=t;
  [].forEach.call($("#c-tipo").children,function(b){b.setAttribute("aria-pressed",b.dataset.t===t)});
  $("#c-loc").hidden=t!=="local";
  $("#c-dom").hidden=t!=="domicilio";
  reglaNombre();
}
// En el local con mesa, el nombre es opcional; sin mesa (o a domicilio), es obligatorio
function conMesa(){return tipo==="local"&&!!$("#c-mesa").value.trim()}
function reglaNombre(){
  $("#c-nom-l").textContent=conMesa()?"Tu nombre (opcional)":"Tu nombre";
  $("#c-nom").placeholder=conMesa()?"Opcional, ya sabemos tu mesa":"Para llamarte cuando esté listo";
  if(conMesa())$("#c-nom").setCustomValidity("");
}
$("#c-mesa").addEventListener("input",reglaNombre);
$("#c-tipo").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  tipoManual=true;ponerTipo(b.dataset.t);geoMsg(geoTxt);
});

// Ubicación: si el cliente está fuera del radio del local, el pedido es a domicilio
var geoTxt="";
function geoMsg(t,err){var e=$("#c-geo");e.textContent=t||"";e.classList.toggle("err",!!err)}
function hayLocal(){return isFinite(parseFloat(data.local_lat))&&isFinite(parseFloat(data.local_lng))}
function metros(a,b,c,d){
  var r=Math.PI/180,x=Math.sin((c-a)*r/2),y=Math.sin((d-b)*r/2);
  return 12742000*Math.asin(Math.sqrt(x*x+Math.cos(a*r)*Math.cos(c*r)*y*y));
}
function ubicar(){
  if(cliente)return evaluar();
  if(buscando)return;
  if(!navigator.geolocation)return geoMsg("Tu teléfono no permite compartir la ubicación. Elige cómo quieres tu pedido.");
  buscando=true;
  geoMsg("📍 Revisando tu ubicación…");
  navigator.geolocation.getCurrentPosition(function(pos){
    buscando=false;
    cliente={lat:pos.coords.latitude,lng:pos.coords.longitude,acc:pos.coords.accuracy||0};
    evaluar();
  },function(){
    buscando=false;
    geoTxt="No pudimos ver tu ubicación. Elige cómo quieres tu pedido.";
    geoMsg(geoTxt);
  },{enableHighAccuracy:true,timeout:12000,maximumAge:120000});
}
function evaluar(){
  var u=$("#c-ubic");u.textContent="📍 Ubicación GPS agregada ✓";u.disabled=true;
  if(!hayLocal()){geoTxt="";geoMsg("");return}
  var d=metros(cliente.lat,cliente.lng,+data.local_lat,+data.local_lng);
  var dentro=d<=(parseFloat(data.radio_local_m)||150)+Math.min(cliente.acc,50);
  if(!tipoManual)ponerTipo(dentro?"local":"domicilio");
  geoTxt=dentro?"📍 Estás en "+data.restaurante+", así que lo marcamos para el local."
    :"📍 Estás a "+(d<1000?Math.round(d/10)*10+" m":Math.round(d/100)/10+" km")+" de "+data.restaurante+", así que lo marcamos a domicilio.";
  geoMsg(geoTxt);
}
$("#c-ubic").addEventListener("click",ubicar);

// Enviar el pedido completo por WhatsApp
function falta(el,t){
  el.setCustomValidity(t);el.reportValidity();el.focus();
}
["#c-nom","#c-dir"].forEach(function(s){$(s).addEventListener("input",function(){this.setCustomValidity("")})});
$("#c-f").addEventListener("submit",function(e){
  e.preventDefault();
  var ls=lineas();if(!ls.length)return;
  var nom=$("#c-nom").value.trim(),dir=$("#c-dir").value.trim(),mesa=$("#c-mesa").value.trim(),nota=$("#c-nota").value.trim();
  if(!tipo){geoMsg("Elige si es para el local o a domicilio.",true);$("#c-tipo").scrollIntoView({block:"center",behavior:"smooth"});return}
  if(!nom&&!conMesa())return falta($("#c-nom"),tipo==="local"?"Escribe tu nombre o tu número de mesa.":"Escribe tu nombre para el pedido.");
  if(tipo==="domicilio"&&!dir)return falta($("#c-dir"),"Escribe tu dirección o un punto de referencia.");
  var m=["¡Hola "+data.restaurante+"! 👋 Quiero hacer un pedido:",""];
  ls.forEach(function(l){m.push("• "+l.q+"× "+l.p.nombre+(l.n==null?" (precio por confirmar)":" — "+fmt(l.n*l.q)))});
  m.push("","*Total: "+fmt(total(ls))+"*"+($("#c-sp").hidden?"":" + precios por confirmar"),"");
  if(nom)m.push("👤 Nombre: "+nom);
  if(tipo==="local")m.push("🍽️ Para el local"+(mesa?" · Mesa "+mesa:""));
  else{
    m.push("🛵 A domicilio","📍 Dirección: "+dir);
    if(cliente)m.push("🗺️ Ubicación: https://maps.google.com/?q="+cliente.lat.toFixed(6)+","+cliente.lng.toFixed(6));
  }
  if(nota)m.push("📝 Nota: "+nota);
  if(nom)LS("menu-nombre",nom);
  if(dir)LS("menu-direccion",dir);
  window.open(waLink(m.join("\n")),"_blank","noopener");
  pedido={};actualizar();
